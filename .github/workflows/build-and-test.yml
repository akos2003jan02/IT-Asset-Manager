name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore IT.Asset.Manager/IT.Asset.Manager.slnx

    - name: Build solution
      run: dotnet build IT.Asset.Manager/IT.Asset.Manager.slnx --no-restore --configuration Release

    - name: Run xUnit tests
      run: dotnet test IT.Asset.Manager.Tests/IT.Asset.Manager.Tests.csproj --configuration Release --verbosity normal
